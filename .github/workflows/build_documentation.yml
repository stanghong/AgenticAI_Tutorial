name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@c69e96c087165ba49b1788e0c3464654dd60253c  # main
    with:
      commit_sha: ${{ github.sha }}
      package: agents-course
      package_name: agents-course
      path_to_docs: agents-course/units/
      additional_args: --not_python_module
      languages: en zh-CN ru-RU vi es ko fr
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
